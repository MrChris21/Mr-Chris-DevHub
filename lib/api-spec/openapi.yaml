  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      description: Returns counts, upcoming reminders, today meetings, recent notes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Note ──────────────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, title, content, tags, pinned, createdAt, updatedAt]
      properties:
        id:        { type: integer }
        title:     { type: string }
        content:   { type: string }
        tags:      { type: array, items: { type: string } }
        pinned:    { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    NoteInput:
      type: object
      required: [title]
      properties:
        title:   { type: string, minLength: 1 }
        content: { type: string }
        tags:    { type: array, items: { type: string } }
        pinned:  { type: boolean }

    NoteUpdate:
      type: object
      properties:
        title:   { type: string, minLength: 1 }
        content: { type: string }
        tags:    { type: array, items: { type: string } }
        pinned:  { type: boolean }

    # ── Reminder ──────────────────────────────────────────────────────────
    Reminder:
      type: object
      required: [id, title, dueAt, done, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        description: { type: ["string", "null"] }
        dueAt:       { type: string, description: "ISO-8601 datetime" }
        done:        { type: boolean }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    ReminderInput:
      type: object
      required: [title, dueAt]
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        dueAt:       { type: string }
        done:        { type: boolean }

    ReminderUpdate:
      type: object
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        dueAt:       { type: string }
        done:        { type: boolean }

    # ── Meeting ──────────────────────────────────────────────────────────
    Meeting:
      type: object
      required: [id, title, startAt, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        description: { type: ["string", "null"] }
        startAt:     { type: string, description: "ISO-8601 datetime" }
        endAt:       { type: ["string", "null"], description: "ISO-8601 datetime" }
        meetLink:    { type: ["string", "null"] }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    MeetingInput:
      type: object
      required: [title, startAt]
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        startAt:     { type: string }
        endAt:       { type: string }
        meetLink:    { type: string }

    MeetingUpdate:
      type: object
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        startAt:     { type: string }
        endAt:       { type: string }
        meetLink:    { type: string }

    # ── Task ──────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        description: { type: ["string", "null"] }
        status:      { type: string, enum: [todo, in_progress, done] }
        priority:    { type: string, enum: [low, medium, high] }
        dueAt:       { type: ["string", "null"] }
        tags:        { type: array, items: { type: string } }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    TaskInput:
      type: object
      required: [title]
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        status:      { type: string, enum: [todo, in_progress, done] }
        priority:    { type: string, enum: [low, medium, high] }
        dueAt:       { type: string }
        tags:        { type: array, items: { type: string } }

    TaskUpdate:
      type: object
      properties:
        title:       { type: string, minLength: 1 }
        description: { type: string }
        status:      { type: string, enum: [todo, in_progress, done] }
        priority:    { type: string, enum: [low, medium, high] }
        dueAt:       { type: string }
        tags:        { type: array, items: { type: string } }

    # ── Prompt ────────────────────────────────────────────────────────────
    Prompt:
      type: object
      required: [id, title, content, model, tags, createdAt, updatedAt]
      properties:
        id:        { type: integer }
        title:     { type: string }
        content:   { type: string }
        model:     { type: string, description: "e.g. gpt-4, claude-3, gemini-pro" }
        tags:      { type: array, items: { type: string } }
        createdAt: { type: string }
        updatedAt: { type: string }

    PromptInput:
      type: object
      required: [title, content]
      properties:
        title:   { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        model:   { type: string }
        tags:    { type: array, items: { type: string } }

    PromptUpdate:
      type: object
      properties:
        title:   { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        model:   { type: string }
        tags:    { type: array, items: { type: string } }

    # ── Snippet ───────────────────────────────────────────────────────────
    Snippet:
      type: object
      required: [id, title, code, language, tags, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        code:        { type: string }
        language:    { type: string, description: "e.g. typescript, python, bash" }
        description: { type: ["string", "null"] }
        tags:        { type: array, items: { type: string } }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    SnippetInput:
      type: object
      required: [title, code, language]
      properties:
        title:       { type: string, minLength: 1 }
        code:        { type: string, minLength: 1 }
        language:    { type: string, minLength: 1 }
        description: { type: string }
        tags:        { type: array, items: { type: string } }

    SnippetUpdate:
      type: object
      properties:
        title:       { type: string, minLength: 1 }
        code:        { type: string, minLength: 1 }
        language:    { type: string, minLength: 1 }
        description: { type: string }
        tags:        { type: array, items: { type: string } }

    # ── Bookmark ──────────────────────────────────────────────────────────
    Bookmark:
      type: object
      required: [id, title, url, tags, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        url:         { type: string }
        description: { type: ["string", "null"] }
        tags:        { type: array, items: { type: string } }
        createdAt:   { type: string }
        updatedAt:   { type: string }

    BookmarkInput:
      type: object
      required: [title, url]
      properties:
        title:       { type: string, minLength: 1 }
        url:         { type: string, minLength: 1 }
        description: { type: string }
        tags:        { type: array, items: { type: string } }

    BookmarkUpdate:
      type: object
      properties:
        title:       { type: string, minLength: 1 }
        url:         { type: string, minLength: 1 }
        description: { type: string }
        tags:        { type: array, items: { type: string } }

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [counts, upcomingReminders, todayMeetings, recentNotes, pendingTasks]
      properties:
        counts:
          type: object
          required: [notes, reminders, meetings, tasks, prompts, snippets, bookmarks]
          properties:
            notes:     { type: integer }
            reminders: { type: integer }
            meetings:  { type: integer }
            tasks:     { type: integer }
            prompts:   { type: integer }
            snippets:  { type: integer }
            bookmarks: { type: integer }
        upcomingReminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        todayMeetings:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
        recentNotes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        pendingTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
